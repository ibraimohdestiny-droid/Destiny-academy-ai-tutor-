services:
  - type: web
    name: destiny-academy-ai-tutor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ALLOWED_ORIGIN
        value: https://ibraimohdestiny-droid.github.io
